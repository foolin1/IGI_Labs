{% extends 'AutoCarApp/base.html' %}
{% block content %}
<section class="add-review">
    <h1>Add a Review</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            {{ form.description.label }}
            {{ form.description }}
        </div>
        <div class="form-group">
            {{ form.rating.label }}
            {{ form.rating }}
        </div>
        <button type="submit">Submit Review</button>
    </form>
</section>
{% endblock %}
